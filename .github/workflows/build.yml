name: Build BushLaunch (Windows EXE)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR
        run: mvn -B package

      - name: Przygotuj Jave do spakowania (pelny zestaw modulow)
        shell: pwsh
        run: |
          jlink --module-path "$env:JAVA_HOME\jmods" --add-modules ALL-MODULE-PATH --output runtime --strip-debug --no-header-files --no-man-pages --compress zip-6

      - name: Zbuduj EXE (jpackage)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force input | Out-Null
          Copy-Item target\BushLaunch-0.2.0.jar input\
          jpackage --type app-image --name BushLaunch --app-version 0.2.0 --vendor BushStar --input input --main-jar BushLaunch-0.2.0.jar --main-class pl.bushstar.bushlaunch.BushLaunch --runtime-image runtime --dest dist
          Compress-Archive -Path dist\BushLaunch -DestinationPath BushLaunch-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BushLaunch-windows
          path: BushLaunch-windows.zip
