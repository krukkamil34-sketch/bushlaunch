name: Build BushLaunch (Windows)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wersja z pom.xml
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $v = $pom.project.version
          "APP_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # target/BushLaunch.exe - jeden plik, uruchamiany dwuklikiem (wymaga Javy 17+)
      - name: Build BushLaunch.exe (jar + launch4j)
        run: mvn -B package

      # Własny runtime Javy (pełny zestaw modułów - launcher używa go też do uruchamiania gry,
      # gdy w systemie nie ma pasującej Javy)
      - name: Runtime Javy (jlink)
        shell: pwsh
        run: |
          jlink --module-path "$env:JAVA_HOME\jmods" --add-modules ALL-MODULE-PATH --output runtime --strip-debug --no-header-files --no-man-pages --compress zip-6

      # Aplikacja z wbudowaną Javą: dist\BushLaunch\BushLaunch.exe
      - name: Zbuduj aplikację (jpackage app-image)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force input | Out-Null
          Copy-Item "target\BushLaunch-$env:APP_VERSION.jar" input\
          jpackage --type app-image --name BushLaunch --app-version $env:APP_VERSION --vendor BushStar `
            --input input --main-jar "BushLaunch-$env:APP_VERSION.jar" --main-class pl.bushstar.bushlaunch.BushLaunch `
            --runtime-image runtime --icon installer\bushlaunch.ico --dest dist

      # Instalator (kreator po polsku/angielsku, skróty, odinstalowanie)
      - name: Zainstaluj Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Zbuduj instalator (BushLaunch-Setup.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\BushLaunch.iss
          if (-not (Test-Path dist\BushLaunch-Setup.exe)) { throw "Brak dist\BushLaunch-Setup.exe" }

      # Wersja przenośna bez instalacji (rozpakuj i uruchom)
      - name: Wersja przenośna (zip)
        shell: pwsh
        run: Compress-Archive -Path dist\BushLaunch -DestinationPath dist\BushLaunch-Portable.zip

      - name: Wystaw pliki w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BushLaunch (najnowsza wersja)
          files: |
            dist/BushLaunch-Setup.exe
            dist/BushLaunch-Portable.zip
            target/BushLaunch.exe

      - uses: actions/upload-artifact@v4
        with:
          name: BushLaunch-windows
          path: |
            dist/BushLaunch-Setup.exe
            dist/BushLaunch-Portable.zip
            target/BushLaunch.exe
